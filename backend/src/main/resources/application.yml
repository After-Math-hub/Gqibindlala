spring:
  application:
    name: gqibindlala-booking

  datasource:
    url: jdbc:postgresql://localhost:5432/gqibindlala
    username: ${DB_USERNAME:gqibindlala}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000  # 24h

app:
  public-url: ${PUBLIC_APP_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@gqibindlala.co.za}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:System Administrator}

brevo:
  api-key: ${BREVO_API_KEY:}
  from: ${BREVO_FROM_EMAIL:}
  sender-name: ${BREVO_SENDER_NAME:Gqibindlala}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
