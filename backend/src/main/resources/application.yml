spring:
  application:
    name: gqibindlala-booking

  datasource:
    url: jdbc:postgresql://localhost:5432/gqibindlala
    username: ${DB_USERNAME:gqibindlala}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000  # 24h

app:
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Initial administrator}
